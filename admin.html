<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMDAT / ADMIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="noise-overlay"></div>

  <main class="page-shell admin-shell">
    <header class="page-topbar">
        <div>IMDAT / TERMINAL / ADMIN</div>
        <div class="page-topbar-right" id="adminTopbarRight">
            <a href="log.html">VIEW LOG</a>
            <button id="logoutBtn" class="button-chip" type="button" hidden>LOGOUT</button>
        </div>
    </header>

    <section id="loginView" class="admin-login-wrap" hidden>
      <div class="panel admin-login-panel">
        <p class="page-kicker">restricted route</p>
        <h1 class="page-title admin-title">ADMIN</h1>

        <form id="loginForm" class="admin-form">
          <label>
            <span>USERNAME</span>
            <input type="text" name="username" required />
          </label>

          <label>
            <span>PASSWORD</span>
            <input type="password" name="password" required />
          </label>

          <button type="submit" class="button-chip">ACCESS</button>
        </form>

        <p id="loginError" class="admin-error"></p>
      </div>
    </section>

    <section id="adminView" hidden>
      <div class="admin-grid">
        <section class="panel">
        <p class="sidebar-label" id="formModeLabel">NEW ENTRY</p>

        <form id="createLogForm" class="admin-form">
  <input type="hidden" name="id" />

  <label>
    <span>TITLE</span>
    <input type="text" name="title" required />
  </label>

  <label>
    <span>CATEGORY</span>
    <select name="category" required>
      <option value="DEV">DEV</option>
      <option value="MUSIC">MUSIC</option>
      <option value="LIFE">LIFE</option>
      <option value="RESEARCH">RESEARCH</option>
    </select>
  </label>

  <label>
    <span>CONTENT / EXCERPT</span>
    <textarea name="content" rows="8" required></textarea>
  </label>

  <label class="admin-check">
    <input type="checkbox" name="pinned" />
    <span>PINNED</span>
  </label>

  <label class="admin-check">
    <input type="checkbox" name="published" />
    <span>PUBLISHED</span>
  </label>

  <div class="admin-actions">
    <button type="submit" class="button-chip" id="submitBtn">PUBLISH ENTRY</button>
    <button type="button" class="button-chip" id="cancelEditBtn" hidden>CANCEL EDIT</button>
  </div>
</form>

        <p id="createMessage" class="admin-message"></p>
        </section>

        <section class="panel">
          <p class="sidebar-label">ARCHIVE PREVIEW</p>
          <div id="adminLogList" class="admin-log-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
