<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMDAT / MUSIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="music-page">
  <div class="grid-overlay"></div>
  <div class="noise-overlay"></div>

  <main class="music-shell">
    <header class="music-topbar">
      <div>IMDAT / MUSIC</div>
      <div class="music-topbar-right">
        <span>SIGNAL ARCHIVE</span>
        <a href="stage.html">BACK</a>
      </div>
    </header>

    <section class="music-hero">
      <div class="music-hero-main">
        <p class="music-kicker">PARTITION 02 / SOUND SYSTEM</p>
        <h1 class="music-title">MUSIC // SAINT NOTHING</h1>
      </div>

      <div class="music-stickers">
        <span>SAINT NOTHING</span>
        <span>LIVE RECORDINGS</span>
        <span>SONG FRAGMENTS</span>
        <span>WORK IN PROGRESS</span>
      </div>
    </section>

    <section class="music-display">
        <div class="music-info-panel">
            <p class="music-feature-label">NOW PLAYING</p>
            <h2 id="track-title">MACHINA</h2>
            <p id="track-caption" class="music-track-caption">
            saint nothing / selected transmission
            </p>

            <div id="track-player" class="custom-player-shell">
            <!-- SoundCloud iframe gets inserted here by JavaScript -->
            </div>

            <div class="music-links" id="track-links">
            <a id="soundcloud-link" href="#" target="_blank" rel="noopener noreferrer">SOUNDCLOUD</a>
            <a id="youtube-link" href="#" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
            </div>
        </div>
    </section>

    <section class="track-panel">
      <div class="track-panel-header">
        <span>TRACK INDEX</span>
        <span>ARCHIVE / PARTIAL</span>
      </div>

      <button class="track-row active" data-track="0" type="button">
        <span>01</span>
        <span>MACHINA</span>
        <span>01:10</span>
      </button>

      <button class="track-row" data-track="1" type="button">
        <span>02</span>
        <span>trotting better</span>
        <span>02:14</span>
      </button>

      <button class="track-row" data-track="2" type="button">
        <span>03</span>
        <span>Saint Valentine</span>
        <span>01:51</span>
      </button>
    </section>
  </main>

  <script src="music.js"></script>
</body>
</html>
